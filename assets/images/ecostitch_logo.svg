<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%" fill="none">
  <!-- Ec*Stitch Brand Mark -->
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g class="brand-text" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" letter-spacing="-1.5">
    <!-- "Ec" -->
    <text x="32" y="86" font-size="82" fill="currentColor">Ec</text>

    <!-- The Signature Stitch Asterisk ('*') in place of 'o' -->
    <g transform="translate(162, 56)" class="stitch-asterisk">
      <!-- Vertical strip -->
      <rect x="-6" y="-30" width="12" height="60" rx="4" fill="currentColor" opacity="0.95" />
      <!-- Stitch dash lines on vertical strip -->
      <line x1="-3" y1="-22" x2="3" y2="-22" stroke="#0C0D0E" stroke-width="1.8" stroke-dasharray="2 2" stroke-linecap="round" />
      <line x1="-3" y1="-10" x2="3" y2="-10" stroke="#0C0D0E" stroke-width="1.8" stroke-dasharray="2 2" stroke-linecap="round" />
      <line x1="-3" y1="10" x2="3" y2="10" stroke="#0C0D0E" stroke-width="1.8" stroke-dasharray="2 2" stroke-linecap="round" />
      <line x1="-3" y1="22" x2="3" y2="22" stroke="#0C0D0E" stroke-width="1.8" stroke-dasharray="2 2" stroke-linecap="round" />

      <!-- Horizontal strip -->
      <rect x="-30" y="-6" width="60" height="12" rx="4" fill="currentColor" opacity="0.95" />
      <!-- Stitch dashes on horizontal strip -->
      <line x1="-22" y1="-3" x2="-22" y2="3" stroke="#0C0D0E" stroke-width="1.8" stroke-dasharray="2 2" stroke-linecap="round" />
      <line x1="-10" y1="-3" x2="-10" y2="3" stroke="#0C0D0E" stroke-width="1.8" stroke-dasharray="2 2" stroke-linecap="round" />
      <line x1="10" y1="-3" x2="10" y2="3" stroke="#0C0D0E" stroke-width="1.8" stroke-dasharray="2 2" stroke-linecap="round" />
      <line x1="22" y1="-3" x2="22" y2="3" stroke="#0C0D0E" stroke-width="1.8" stroke-dasharray="2 2" stroke-linecap="round" />

      <!-- Diagonal strip 45 deg -->
      <rect x="-6" y="-28" width="12" height="56" rx="4" transform="rotate(45)" fill="currentColor" opacity="0.9" />

      <!-- Diagonal strip -45 deg -->
      <rect x="-6" y="-28" width="12" height="56" rx="4" transform="rotate(-45)" fill="currentColor" opacity="0.9" />

      <!-- Center tiny rivet/stitch pin -->
      <circle cx="0" cy="0" r="3.5" fill="#0C0D0E" />
    </g>

    <!-- "Stitch" -->
    <text x="206" y="86" font-size="82" fill="currentColor">Stitch</text>
  </g>
</svg>
